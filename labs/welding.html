<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лаба: сварка</title>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<header>
  <h1>Лаба вида работ: сварка</h1>
  <p>Изолированный расчёт · роли бригады · зависимости объекта · НК отключён</p>
  <nav>
    <a href="./index.html">Обзор</a>
    <a href="./ndt.html">НК</a>
    <a class="active" href="./welding.html">Сварка</a>
    <a href="./logistics.html">Логистика</a>
  </nav>
</header>
<main>
<section class="card" id="formCard">
  <div class="badge">workType = welding · методы НК скрыты</div>
  <div class="section">
    <h3>Объект и объём</h3>
    <div class="grid">
      <div>
        <label for="object">Объект</label>
        <select id="object">
          <option value="pipe">Трубопровод</option>
          <option value="tank">Резервуар</option>
          <option value="metal" selected>Металлоконструкция</option>
          <option value="vessel">Сосуд / котёл</option>
          <option value="other">Другое</option>
        </select>
      </div>
      <div id="wrapJoints"><label for="joints">Стыки</label><input id="joints" type="number" min="0" value="0"></div>
      <div id="wrapMeters"><label for="meters">П.м.</label><input id="meters" type="number" min="0" step="0.1" value="10"></div>
      <div id="wrapDiameter"><label for="diameter">Диаметр, мм</label><input id="diameter" type="number" min="0" value="530"></div>
      <div id="wrapThickness"><label for="thickness">Толщина, мм</label><input id="thickness" type="number" min="0" step="0.1" value="12"></div>
      <div>
        <label for="urgency">Срочность</label>
        <select id="urgency"><option value="1">1</option><option value="1.3">1.3</option><option value="1.5">1.5</option></select>
      </div>
      <div>
        <label for="access">Доступ</label>
        <select id="access"><option value="1">1</option><option value="1.15">1.15</option><option value="1.25">1.25</option><option value="1.4">1.4</option></select>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="section">
    <h3>Роли бригады</h3>
    <div id="roles"></div>
    <div class="hint" id="depsText"></div>
  </div>
</section>
<aside class="card result">
  <h2>Итог сварки</h2>
  <div class="price" id="total">0 ₽</div>
  <div class="row"><span>База сварки</span><span id="weldBase">0</span></div>
  <div class="row"><span>НК</span><span id="ndtBase">0</span></div>
  <div class="row"><span>Стыки ₽</span><span id="bj">0</span></div>
  <div class="row"><span>П.м. ₽</span><span id="bm">0</span></div>
  <div class="row"><span>k толщины</span><span id="kt">×1</span></div>
  <div class="row"><span>k диаметра</span><span id="kd">×1</span></div>
  <div class="row"><span>Людей</span><span id="crew">0</span></div>
  <p class="note" id="formula"></p>
</aside>
</main>
<script type="module">
import { calculateWelding, rub } from '../src/index.mjs';

const el = (id) => document.getElementById(id);

function syncVisibility(deps) {
  el('wrapJoints').classList.toggle('dep-hidden', !deps.effective.showJoints);
  el('wrapMeters').classList.toggle('dep-hidden', !deps.effective.showMeters);
  el('wrapDiameter').classList.toggle('dep-hidden', !deps.effective.showDiameter);
  el('wrapThickness').classList.toggle('dep-hidden', !deps.effective.showThickness);
}

function run() {
  const r = calculateWelding({
    objectKey: el('object').value,
    joints: el('joints').value,
    meters: el('meters').value,
    diameter: el('diameter').value,
    thickness: el('thickness').value,
    urgency: el('urgency').value,
    access: el('access').value
  });
  syncVisibility(r.deps);
  el('total').textContent = rub(r.total);
  el('weldBase').textContent = rub(r.weldBase);
  el('ndtBase').textContent = rub(r.ndtBase);
  el('bj').textContent = rub(r.breakdown.joints);
  el('bm').textContent = rub(r.breakdown.meters);
  el('kt').textContent = '× ' + r.kt.toFixed(2);
  el('kd').textContent = '× ' + r.kd.toFixed(2);
  el('crew').textContent = String(r.crew.total);
  el('formula').textContent = r.formula;
  el('hint').textContent = (r.warnings || []).join(' · ') || 'Ок';
  el('hint').classList.toggle('warn', (r.warnings || []).length > 0);
  el('roles').innerHTML = r.crew.roles.map((x) =>
    `<div class="row"><span>${x.label}</span><span>${x.count}</span></div>`
  ).join('');
  el('depsText').textContent =
    `${r.deps.objectLabel}: methods=${r.deps.fields.methods.state}, points=${r.deps.fields.points.state}, Ø=${r.deps.fields.diameter.state}`;
}

el('formCard').addEventListener('input', run);
el('formCard').addEventListener('change', run);
run();
</script>
</body>
</html>
