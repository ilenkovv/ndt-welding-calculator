<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лаба: НК</title>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<header>
  <h1>Лаба вида работ: НК</h1>
  <p>Изолированный расчёт · зависимости объекта · роли методов · без сварки</p>
  <nav>
    <a href="./index.html">Обзор</a>
    <a class="active" href="./ndt.html">НК</a>
    <a href="./welding.html">Сварка</a>
    <a href="./logistics.html">Логистика</a>
  </nav>
</header>
<main>
<section class="card" id="formCard">
  <div class="badge">workType = ndt · сварка = 0</div>
  <div class="section">
    <h3>Объект и объём</h3>
    <div class="grid">
      <div>
        <label for="object">Объект</label>
        <select id="object">
          <option value="pipe">Трубопровод</option>
          <option value="tank">Резервуар</option>
          <option value="metal">Металлоконструкция</option>
          <option value="vessel">Сосуд / котёл</option>
          <option value="other">Другое</option>
        </select>
      </div>
      <div id="wrapJoints"><label for="joints">Стыки</label><input id="joints" type="number" min="0" value="10"></div>
      <div id="wrapMeters"><label for="meters">П.м.</label><input id="meters" type="number" min="0" step="0.1" value="0"></div>
      <div id="wrapPoints"><label for="points">Точки / снимки</label><input id="points" type="number" min="0" value="0"></div>
      <div id="wrapDiameter"><label for="diameter">Диаметр, мм</label><input id="diameter" type="number" min="0" value="108"></div>
      <div id="wrapThickness"><label for="thickness">Толщина, мм</label><input id="thickness" type="number" min="0" step="0.1" value="6"></div>
      <div>
        <label for="urgency">Срочность</label>
        <select id="urgency"><option value="1">1</option><option value="1.3">1.3</option><option value="1.5">1.5</option></select>
      </div>
      <div>
        <label for="access">Доступ</label>
        <select id="access"><option value="1">1</option><option value="1.15">1.15</option><option value="1.25">1.25</option><option value="1.4">1.4</option></select>
      </div>
    </div>
  </div>
  <div class="section">
    <h3>Методы НК</h3>
    <div class="checks" id="methodsList"></div>
    <div class="hint" id="hint"></div>
    <div class="hint" id="depsText"></div>
  </div>
</section>
<aside class="card result">
  <h2>Итог НК</h2>
  <div class="price" id="total">0 ₽</div>
  <div class="row"><span>База НК</span><span id="ndtBase">0</span></div>
  <div class="row"><span>Сварка</span><span id="weldBase">0</span></div>
  <div class="row"><span>k толщины</span><span id="kt">×1</span></div>
  <div class="row"><span>k диаметра</span><span id="kd">×1</span></div>
  <div class="row"><span>Условия</span><span id="kc">×1</span></div>
  <div class="row"><span>Бригада НК</span><span id="crew">0</span></div>
  <p class="note" id="formula"></p>
</aside>
</main>
<script type="module">
import { calculateNdt, listNdtMethods, rub } from '../src/index.mjs';

const el = (id) => document.getElementById(id);
const box = el('methodsList');
for (const m of listNdtMethods()) {
  const lab = document.createElement('label');
  lab.className = 'check';
  lab.innerHTML = `<input class="method" type="checkbox" value="${m.key}" ${m.key === 'vik' ? 'checked' : ''}><span>${m.name}</span>`;
  box.appendChild(lab);
}

function selectedMethods() {
  return [...document.querySelectorAll('.method:checked')].map((n) => n.value);
}

function syncVisibility(deps) {
  const map = {
    wrapJoints: deps.effective.showJoints,
    wrapMeters: deps.effective.showMeters,
    wrapPoints: deps.effective.showPoints,
    wrapDiameter: deps.effective.showDiameter,
    wrapThickness: deps.effective.showThickness
  };
  for (const [id, show] of Object.entries(map)) {
    el(id).classList.toggle('dep-hidden', !show);
  }
}

function run() {
  const r = calculateNdt({
    objectKey: el('object').value,
    methods: selectedMethods(),
    joints: el('joints').value,
    meters: el('meters').value,
    points: el('points').value,
    diameter: el('diameter').value,
    thickness: el('thickness').value,
    urgency: el('urgency').value,
    access: el('access').value
  });
  syncVisibility(r.deps);
  el('total').textContent = rub(r.total);
  el('ndtBase').textContent = rub(r.ndtBase);
  el('weldBase').textContent = rub(r.weldBase);
  el('kt').textContent = '× ' + r.kt.toFixed(2);
  el('kd').textContent = '× ' + r.kd.toFixed(2);
  el('kc').textContent = '× ' + r.kc.toFixed(2);
  el('crew').textContent = String(r.crew);
  el('formula').textContent = r.formula;
  el('hint').textContent = (r.warnings || []).join(' · ') || 'Ок';
  el('hint').classList.toggle('warn', (r.warnings || []).length > 0);
  const f = r.deps.fields;
  el('depsText').textContent =
    `${r.deps.objectLabel}: стыки=${f.joints.state}, п.м.=${f.meters.state}, точки=${f.points.state}, Ø=${f.diameter.state}, t=${f.thickness.state}, методы=${f.methods.state}`;
}

el('formCard').addEventListener('input', run);
el('formCard').addEventListener('change', run);
run();
</script>
</body>
</html>
