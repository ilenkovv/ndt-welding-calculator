<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Робот-секретарь</title>
<link rel="stylesheet" href="./shared.css">
<style>
.script-box{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;line-height:1.5;background:#f4f7fb;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:70vh;overflow:auto}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px;background:#fff}
.step h4{margin:0 0 6px;font-size:.92rem}
.step .ask{font-weight:600;margin:0 0 6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.toolbar button{border:0;border-radius:8px;padding:8px 12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font:inherit}
.toolbar button.secondary{background:#687789}
main.single{grid-template-columns:1fr}
</style>
</head>
<body>
<header>
  <h1>Скрипт робота-секретаря</h1>
  <p>Автодиалог менеджера по продажам: сбор полей заявки для расчёта НК / сварки</p>
  <nav>
    <a href="./index.html">Обзор</a>
    <a href="./ndt.html">НК</a>
    <a href="./welding.html">Сварка</a>
    <a href="./logistics.html">Логистика</a>
    <a class="active" href="./secretary-bot.html">Робот-секретарь</a>
    <a href="./sales-human.html">Менеджер</a>
  </nav>
</header>
<main class="single">
<section class="card">
  <div class="badge">CLI: node scripts/secretary-bot.mjs · --demo · --json</div>
  <div class="toolbar">
    <button type="button" id="btnDemo">Показать демо-диалог</button>
    <button type="button" class="secondary" id="btnSteps">Карточки вопросов</button>
    <button type="button" class="secondary" id="btnCopy">Скопировать JSON-плейбук</button>
  </div>
  <div id="out" class="script-box">Загрузка скрипта…</div>
</section>
</main>
<script type="module">
import { FIELD_CATALOG, INTAKE_ORDER, listFields } from '../src/index.mjs';

const OPENING = [
  'Здравствуйте! Я секретарь отдела продаж по НК и сварке.',
  'Задам несколько вопросов — подготовлю заявку для расчёта стоимости.',
  'Можно отвечать кратко. Если чего-то не знаете — скажите «не знаю» или «пропустить».'
];
const CLOSING = [
  'Спасибо! Заявку собрал.',
  'Передаю менеджеру на расчёт КП. Если появятся чертежи или НТД — пришлите ответом.'
];

const DEMO_ANSWERS = {
  client: 'ООО «СеверТруб»',
  contact: 'Петров А.С., +7 900 000-00-00, инженер',
  city: 'Казань',
  address: 'промзона Юг, цех 2',
  workType: 'Сварка + НК',
  object: 'Трубопровод',
  joints: '12',
  meters: '0',
  points: '0',
  diameter: '219',
  thickness: '10',
  methods: 'ВИК, УЗК',
  urgency: 'стандарт',
  access: 'стеснённый',
  transport: 'авто',
  people: '2',
  workDays: '2',
  nights: 'авто',
  comment: 'ГОСТ, допуск по пропускам'
};

const out = document.getElementById('out');

function renderDemo() {
  let t = '=== ДЕМО ДИАЛОГА РОБОТА-СЕКРЕТАРЯ ===\n\n';
  for (const line of OPENING) t += `Бот: ${line}\n`;
  t += '\n';
  for (const id of INTAKE_ORDER) {
    const f = FIELD_CATALOG[id];
    t += `Бот: ${f.botAsk}\n`;
    if (f.options) t += `     Варианты: ${f.options.map((o) => o.label).join(' / ')}\n`;
    t += `     (поле №${f.num} «${f.label}»: ${f.description})\n`;
    t += `Клиент: ${DEMO_ANSWERS[id] ?? 'не знаю'}\n`;
    if (f.botFollowUp) t += `Бот: ${f.botFollowUp}\n`;
    t += '\n';
  }
  for (const line of CLOSING) t += `Бот: ${line}\n`;
  t += '\n=== КАРТОЧКА ЗАЯВКИ ===\n' + JSON.stringify(DEMO_ANSWERS, null, 2);
  out.textContent = t;
}

function renderSteps() {
  out.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'hint';
  title.style.marginBottom = '10px';
  title.textContent = 'Пошаговые карточки вопросов. Ветвления: welding → без методов/точек; metal → без диаметра.';
  out.appendChild(title);
  out.classList.remove('script-box');
  for (const id of INTAKE_ORDER) {
    const f = FIELD_CATALOG[id];
    const step = document.createElement('div');
    step.className = 'step';
    step.innerHTML =
      `<h4>№${f.num} ${f.label} ${f.required ? '· обязательно' : '· по ситуации'} ${f.price ? '· в цене' : ''}</h4>` +
      `<p class="ask">Спросить: ${f.botAsk}</p>` +
      `<p class="hint">Описание: ${f.description}</p>` +
      (f.botFollowUp ? `<p class="hint">Уточнение: ${f.botFollowUp}</p>` : '') +
      (f.options ? `<p class="hint">Варианты: ${f.options.map((o) => o.label).join('; ')}</p>` : '');
    out.appendChild(step);
  }
}

function playbookJson() {
  return {
    role: 'secretary_bot_sales',
    title: 'Робот-секретарь отдела продаж (НК / сварка)',
    opening: OPENING,
    closing: CLOSING,
    rules: [
      'Один вопрос за ход',
      '«не знаю» → null и дальше',
      'Не называть финальную цену',
      'welding → без методов НК и точек',
      'metal → без диаметра',
      'РК/толщинометрия → обязательно точки'
    ],
    fields: listFields()
  };
}

document.getElementById('btnDemo').onclick = () => {
  out.className = 'script-box';
  renderDemo();
};
document.getElementById('btnSteps').onclick = renderSteps;
document.getElementById('btnCopy').onclick = async () => {
  const text = JSON.stringify(playbookJson(), null, 2);
  try {
    await navigator.clipboard.writeText(text);
    out.className = 'script-box';
    out.textContent = 'JSON-плейбук скопирован в буфер.\n\n' + text;
  } catch {
    out.className = 'script-box';
    out.textContent = text;
  }
};

renderDemo();
</script>
</body>
</html>
