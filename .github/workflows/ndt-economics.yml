name: NDT economics tests
on:
  push:
    branches: [feature/ndt-calculator-mvp]
  pull_request:
jobs:
  ndt-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ndt-economics.test.mjs
      - run: npm run test:unit
